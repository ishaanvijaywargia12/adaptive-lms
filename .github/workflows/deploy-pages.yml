name: Deploy Frontend → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:  # Allow manual trigger

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build React SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build for GitHub Pages
        run: npm run build
        working-directory: frontend
        env:
          VITE_BASE_PATH: /adaptive-lms/
          # These are set as GitHub Actions Secrets:
          # Settings → Secrets and variables → Actions → New repository secret
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_KEYCLOAK_URL: ${{ secrets.VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: ${{ secrets.VITE_KEYCLOAK_REALM || 'lms-demo' }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ secrets.VITE_KEYCLOAK_CLIENT_ID || 'lms-frontend' }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}

      - name: Add .nojekyll to prevent Jekyll processing
        run: touch frontend/dist/.nojekyll

      - name: Add SPA 404 redirect for client-side routing
        # GitHub Pages returns 404 for direct URL access to SPA routes.
        # This copies index.html as 404.html so React Router handles the route.
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
