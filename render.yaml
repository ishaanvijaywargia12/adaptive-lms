# render.yaml — Render.com service definitions (100% Free Tier)
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy steps:
# 1. Push repo to GitHub (already done: https://github.com/ishaanvijaywargia12/adaptive-lms)
# 2. Go to https://dashboard.render.com/ → New → Blueprint → Connect this repo
# 3. Fill in the prompt environment variables (Neon PostgreSQL connection string)
#
# Free Tier Specs:
# - Oregon region
# - Spring Boot backend running in Docker
# - Programmatic Flyway auto-initializes schema on startup
# - LMS_EVENTS_MODE=sync (in-process events — no Kafka required)

services:
  # ─── Spring Boot Backend ──────────────────────────────────────────────────────
  - type: web
    name: adaptive-lms-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo

      # ── PostgreSQL (Neon.tech free tier string) ──────────────────────────────
      - key: SPRING_DATASOURCE_URL
        sync: false  # Paste your Neon JDBC URL e.g. jdbc:postgresql://ep-xxx.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false  # Neon username
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false  # Neon password

      # ── Event Mode (sync = in-process, zero Kafka dependency) ────────────────
      - key: LMS_EVENTS_MODE
        value: sync

      - key: LMS_DEFAULT_TENANT
        value: demo

      # ── Qdrant Cloud (Free Tier — 1GB cluster at cloud.qdrant.io) ────────────
      - key: QDRANT_HOST
        sync: false  # e.g. xxx-xxx.us-east-4-0.aws.cloud.qdrant.io
      - key: QDRANT_PORT
        value: "6334"
      - key: QDRANT_API_KEY
        sync: false  # API key from Qdrant Cloud dashboard
      - key: QDRANT_USE_TLS
        value: "true"

      # ── Gemini AI Key ────────────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false  # Gemini API Key

      # ── CORS ──────────────────────────────────────────────────────────────────
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ishaanvijaywargia12.github.io,http://localhost:3000,http://localhost:5173"

      - key: APP_BASE_URL
        sync: false  # e.g. https://adaptive-lms-backend.onrender.com
