worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 550M;

    # Use Docker's internal DNS resolver — resolves at request time, not startup
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Main server ──────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        set $backend_host "backend:8080";
        set $frontend_host "frontend:80";

        # API routes → Spring Boot
        location /api/ {
            proxy_pass http://$backend_host/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Public verification endpoint
        location /public/ {
            proxy_pass http://$backend_host/public/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket (STOMP) → Spring Boot
        location /ws {
            proxy_pass http://$backend_host/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Swagger UI
        location /swagger-ui/ {
            proxy_pass http://$backend_host/swagger-ui/;
            proxy_set_header Host $host;
        }

        # Actuator
        location /actuator/ {
            proxy_pass http://$backend_host/actuator/;
            proxy_set_header Host $host;
        }

        # SPA → React
        location / {
            proxy_pass http://$frontend_host;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # OpenAPI Docs
        location /v3/api-docs/ {
            proxy_pass http://$backend_host/v3/api-docs/;
            proxy_set_header Host $host;
        }
    }

    # ── Tenant subdomain routing ─────────────────────────────────────────────────
    # e.g. demo.lms.com → same backend, Host header carries subdomain
    server {
        listen 80;
        server_name ~^(?<tenant>.+)\.lms\.com$;

        set $backend_host "backend:8080";
        set $frontend_host "frontend:80";

        location /api/ {
            proxy_pass http://$backend_host/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Tenant-ID $tenant;
        }

        location / {
            proxy_pass http://$frontend_host;
            proxy_set_header Host $host;
        }
    }
}
